<style>

*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:14px var(--font);user-select:none}

#desk{position:fixed;inset:0 0 48px 0;padding:14px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,92px);grid-auto-columns:92px;gap:6px;align-content:start;z-index:2}

@keyframes pop{from{opacity:0;transform:scale(.96)}}.win.min{display:none}.win.max{inset:0 0 48px 0!important;width:auto!important;height:auto!important;border-radius:0}
.tb{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 12px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--line);cursor:default;flex:none}.tb span{flex:1;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb button{width:34px;height:28px;border:0;border-radius:6px;background:none;color:var(--tx);font-size:14px;cursor:pointer}.tb button:hover{background:rgba(255,255,255,.12)}.tb .x:hover{background:#e5484d}
.bd{flex:1;overflow:auto;padding:22px;user-select:text;line-height:1.65;color:#d5dae6}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.file{padding:14px 8px;border-radius:8px;text-align:center;font-size:12px;border:1px solid transparent;cursor:default}.file:hover{background:rgba(255,255,255,.08);border-color:var(--line)}.file b{display:block;font-size:36px;font-weight:400;margin-bottom:4px}.file small{display:block;color:var(--mu);font-size:10px}

#start{width:40px;height:36px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}#start:hover{filter:brightness(1.15)}
#tasks{flex:1;display:flex;gap:4px;overflow:hidden}.task{height:36px;max-width:160px;padding:0 12px;border:0;border-bottom:2px solid transparent;border-radius:6px;background:rgba(255,255,255,.06);color:var(--tx);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.task.on{background:rgba(255,255,255,.16);border-bottom-color:var(--acc)}

.ex{display:flex;margin:-22px;height:calc(100% + 44px)}.side{width:150px;flex:none;padding:10px 6px;border-right:1px solid var(--line);background:rgba(255,255,255,.03);font-size:12px}.side div{padding:7px 10px;border-radius:6px;cursor:default}.side div:hover{background:rgba(255,255,255,.1)}.side small{display:block;padding:6px 10px;color:var(--mu);font-size:10px;letter-spacing:.1em;text-transform:uppercase}.exm{flex:1;overflow:auto;display:flex;flex-direction:column}.exm .grid{flex:1;padding:6px 10px;align-content:start}.addr{margin:8px;padding:6px 12px;border-radius:6px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:12px;color:var(--mu)}.sbar{padding:6px 12px;font-size:11px;color:var(--mu);border-top:1px solid var(--line)}
.term{margin:-22px;padding:14px;height:calc(100% + 44px);overflow:auto;background:#0c0c0c;font:12px/1.6 ui-monospace,Menlo,monospace;color:#d8f3dc}.term p{margin:0;white-space:pre-wrap}.term .pr{color:#4ade80}.term input{background:none;border:0;outline:0;color:inherit;font:inherit;width:60%}
.np{margin:-22px;width:calc(100% + 44px);height:calc(100% + 44px);display:block;padding:14px;border:0;outline:0;resize:none;background:#fff;color:#111;font:13px/1.6 ui-monospace,Menlo,monospace;user-select:text}
.sw{display:flex;gap:8px;margin:8px 0}.sw i{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent}.sw i:hover{border-color:#fff}.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}

.pdf{margin:-22px;height:calc(100% + 44px);display:flex;flex-direction:column}.pdf .pb{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}.pdf .pb .btn{margin:0}.pdf .pb span{flex:1;font-size:12px;color:var(--mu)}.pdf iframe{flex:1;border:0;background:#fff;width:100%}

redmane:{i:'🧬',n:'REDMANE Workflow',c:'Bioinformatics',h:`<h1>REDMANE Workflow</h1><div class="sub">Synthetic multi-omics data pipeline · WEHI RCP Melbourne</div><p>Implemented short-read variant-calling steps (FASTQ → BAM → VCF) with Linux bioinformatics tools, and used Genome in a Bottle (GIAB) data to build realistic datasets and validate formats, metadata and outputs. Co-author of the 2026 Fast Track Report.</p>${F(['FASTQ (raw)','Alignment (BWA)','BAM','Variant calling (BCFtools)','VCF'])}${T(['Python','Nextflow','SAMtools','BCFtools','GIAB','Bash'])}${L('https://github.com/Thesuperiorscientist/WEHI_DataCommon','GitHub ↗')}${L('https://zenodo.org/records/19081661','Publication ↗','g')}`},

plasycle:{i:'♻️',n:'Plasycle',c:'AI / Sustainability',h:`<h1>Plasycle</h1><div class="sub">Plastic waste into STEM education</div><p>Circular-economy concept: AI-assisted plastic identification, filament extrusion, and 3D-printed microscopes and lab aids for rural schools. I designed and built the web platform, scanner demo and impact storytelling.</p>${F(['Collect plastic','AI identification','Filament','3D-print STEM aids','Rural schools'])}${T(['TensorFlow.js','AI','3D Printing'])}${L('https://plasycle.netlify.app','Live demo ↗')}`},
crim:{i:'📊',n:'AIU / CRIM',c:'Full-stack',h:`<h1>AIU | CRIM</h1><div class="sub">Research publication system</div><p>Submission and approval workflow, Chart.js analytics dashboard, user portfolios and search/filtering.</p>${F(['Bootstrap + Chart.js','PHP','MySQL','Apache'])}${T(['PHP','MySQL','Chart.js'])}`},

remit:{i:'💸',n:'REMIT Timing Agent',c:'FinTech / AI agent',h:`<h1>REMIT Timing Agent</h1><div class="sub">AI planner for student remittances</div><p>An agent that helps an international student decide how and when to send money home under a deadline, with quantified risk, and a hard guarantee that the AI can never move money: it only proposes, a human approves.</p><ul><li>Transfer planner: send now / wait / split</li><li>Deterministic engine; LLM never produces numbers</li><li>Sandbox wallet, approval inbox, hash-chained audit log</li><li>31 tests, no runtime npm dependencies</li></ul>${F(['Student UI','Tool-calling LLM','Permission tiers','Deterministic engine','Sandbox wallet','Human approval'])}${T(['Node.js','LLM tool-calling','Groq','Playwright'])}${L('https://github.com/Thesuperiorscientist/REMIT','GitHub ↗')}`}};

about:{i:'👤',n:'About',w:560,h:480,h_:`<h1>Aung Kaung Myat</h1><div class="sub">Computer Science (Data Science) · Malaysia · originally Myanmar</div><p>I build at the intersection of <b>software engineering, data science and computational biology</b>: scalable data pipelines, bioinformatics tools and full-stack apps. Currently focused on MLOps, genomic data processing and cloud-native applications for healthcare and research.</p><h2>Toolkit</h2>${T(['Python','JavaScript','PHP','C','Bash','Pandas','NumPy','Scikit-learn','MySQL','Biopython','Nextflow','Docker','Linux','Git','Flask','SAMtools','BCFtools','Chart.js','Arduino','Three.js'])}<p class="sub">6 projects · 2+ years experience · Open to research &amp; collaboration</p>`},

experience:{i:'💼',n:'Experience',w:580,h:480,h_:`<h1>Experience</h1><h3>Big Data Engineer Intern</h3><div class="sub">WEHI — RCP Melbourne · 2025</div><ul><li>Built a synthetic multi-omics workflow (FASTQ → BAM → VCF).</li><li>Used GIAB data for realistic datasets.</li><li>Co-authored the Fast Track Report (Zenodo, 2026).</li></ul><h3>Vice President</h3><div class="sub">STEAM Club, Albukhary International University · 2024–2025</div><ul><li>Led event coordination across multiple club events.</li></ul><h3>CAD Drafter</h3><div class="sub">Cad Crowd · 2021–2024</div><ul><li>Designed 3D CAD models from client requirements.</li></ul><h3>Teaching &amp; Social Impact</h3><div class="sub">Refugee education, Malaysia</div><ul><li>Taught refugee children; explored technology for accessibility, sustainability and education.</li></ul>`},
education:{i:'🎓',n:'Education',w:520,h:340,h_:`<h1>Education</h1><h3>B.Sc. Computer Science (Hons)</h3><div class="sub">Albukhary International University · 2025 – present</div><ul><li>Software engineering, machine learning, data science.</li><li>Specializing in Data Science.</li></ul><h3>Foundation in Computing</h3><div class="sub">Albukhary International University · 2024–2025</div><ul><li>DBMS, C, JavaScript, PHP, server-side development.</li></ul>`},
research:{i:'📄',n:'Research.pdf',w:520,h:300,h_:`<h1>Research output</h1><h3>Fast Track Report: WEHI RCP Internship Intake 15 — REDMANE Workflow Team</h3><div class="sub">Zenodo · March 2026 · v1</div>${L('https://zenodo.org/records/19081661','Read publication ↗')}`},
contact:{i:'✉️',n:'Contact',w:480,h:300,h_:`<h1>Let's make it real.</h1><p>Interested in research, engineering, or building something meaningful together?</p>${L('mailto:kaungmyataung1162004@gmail.com','Email ↗')}${L('https://github.com/Thesuperiorscientist','GitHub ↗','g')}${L('https://www.linkedin.com/in/kaungmyathatesjavascript/','LinkedIn ↗','g')}<a class="btn g" href="#" onclick="open('resume');return false">Résumé ↗</a>`},

A.resume={i:'📋',n:'Résumé',w:620,h:580,h_:`<button class="btn noprint" id="pr" style="border:0;cursor:pointer;float:right">🖨 Print / Save PDF</button><h1>Aung Kaung Myat</h1><div class="sub">Software · Data Engineering · MLOps · Bioinformatics<br>Malaysia · kaungmyataung1162004@gmail.com<br>github.com/Thesuperiorscientist · linkedin.com/in/kaungmyathatesjavascript</div><h2>Summary</h2><p>Computer Science student (Data Science) building scalable data pipelines, bioinformatics tools and full-stack applications. Interested in AI/ML, genomics and MLOps for healthcare and research.</p><h2>Experience</h2><h3>Big Data Engineer Intern — WEHI, RCP Melbourne <span class="sub">(2025)</span></h3><ul><li>Built a synthetic multi-omics workflow (FASTQ → BAM → VCF) using GIAB data.</li><li>Co-authored the REDMANE Fast Track Report (Zenodo, 2026).</li></ul><h3>Vice President — STEAM Club, AIU <span class="sub">(2024–2025)</span></h3><ul><li>Led event coordination across multiple club events.</li></ul><h3>CAD Drafter — Cad Crowd <span class="sub">(2021–2024)</span></h3><ul><li>Designed 3D CAD models from client requirements.</li></ul><h2>Education</h2><h3>B.Sc. Computer Science (Hons), Data Science — Albukhary International University <span class="sub">(2025–present)</span></h3><h3>Foundation in Computing — Albukhary International University <span class="sub">(2024–2025)</span></h3><h2>Projects</h2><ul><li><b>REDMANE Workflow</b> — FASTQ → BAM → VCF bioinformatics pipeline</li><li><b>Protinus</b> — 3D protein structure viewer (Flask, NGL.js)</li><li><b>Plasycle</b> — AI plastic recycling into STEM learning aids</li><li><b>AIU | CRIM</b> — research publication system (PHP, MySQL)</li><li><b>EMG Prosthetic Hand</b> — Arduino, 3D-printed</li><li><b>REMIT Timing Agent</b> — human-approved AI remittance planner</li></ul><h2>Skills</h2>${T(['Python','JavaScript','PHP','C','Bash','Pandas','NumPy','Scikit-learn','MySQL','Biopython','Nextflow','Docker','Linux','Git','Flask','SAMtools','BCFtools'])}`,init:el=>{el.querySelector('#pr').onclick=()=>{document.body.classList.add('printing');el.classList.add('pt');print();setTimeout(()=>{document.body.classList.remove('printing');el.classList.remove('pt')},600)}}};
A.terminal={i:'⌨️',n:'Terminal',w:560,h:380,h_:`<div class="term"><div class="out"></div><span class="pr">visitor@portfolio</span>:~$ <input spellcheck="false" autocomplete="off"></div>`,init:el=>{const t=el.querySelector('.term'),i=el.querySelector('input'),out=el.querySelector('.out');const say=h=>{out.insertAdjacentHTML('beforeend','<p>'+h+'</p>');t.scrollTop=1e9};

say('Portfolio OS [Version 1.0]\nType <b>help</b> to begin.');t.onclick=()=>i.focus();

const u=Uint8Array.from(atob(GLB),c=>c.charCodeAt(0)).buffer;
const gltf=await new GLTFLoader().parseAsync(u,'');
const r=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});r.setPixelRatio(Math.min(2,devicePixelRatio||1));
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches,sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,1,.1,50),grp=new THREE.Group();cam.position.set(0,.05,3.8);sc.add(grp);
const model=gltf.scene,bb=new THREE.Box3().setFromObject(model),c=bb.getCenter(new THREE.Vector3()),sz=bb.getSize(new THREE.Vector3());
model.position.sub(c);const k=2/Math.max(sz.x,sz.y,sz.z);const holder=new THREE.Group();holder.add(model);holder.scale.setScalar(k);grp.add(holder);

const meshes=[];model.traverse(o=>{if(o.isMesh)meshes.push(o)});
for(const m of meshes){const w=new THREE.Mesh(m.geometry,wire);m.add(w);m.material=occ}
const fit=()=>{const W=box.clientWidth,H=box.clientHeight;r.setSize(W,H,false);cam.aspect=W/H;cam.position.z=3.8*(W/H<.8?.8/(W/H):1);cam.updateProjectionMatrix()};
fit();addEventListener('resize',fit);
let mx=0,my=0,yaw=0,pit=0;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1});
tag.textContent='3D scan · live';
(function f(ms){requestAnimationFrame(f);const t=ms/1000;yaw+=((rm?.25:Math.sin(t*.6)*.5)+mx*.5-yaw)*.08;pit+=(my*.2-pit)*.08;grp.rotation.set(pit,yaw,0);r.render(sc,cam)})(0);
